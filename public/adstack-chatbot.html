function asDetectHotness(text) {
  var hot = /je (veux|prends|m.abonne|paie|vais|suis intéressé)|c.est bon|je fonce|ok je|on y va|comment (je paie|m.abonner|passer|acheter)/i;
  var medium = /intéressant|pas mal|pourquoi pas|j.hésite|je réfléchis|peut-être/i;
  if (hot.test(text)) asHotness += 3;
  else if (medium.test(text)) asHotness += 1;
}

  wrap.appendChild(bubble); msgs.appendChild(wrap); msgs.scrollTop = msgs.scrollHeight;
}

function asShowTyping() {
  var msgs = document.getElementById('as-messages');
  var el = document.createElement('div'); el.className = 'as-msg bot'; el.id = 'as-typing';
  var av = document.createElement('div'); av.className = 'as-msg-av'; av.innerHTML = AS_AVATAR_SVG;
  var b = document.createElement('div'); b.className = 'as-msg-bubble';
  var t = document.createElement('div'); t.className = 'as-typing'; t.innerHTML = '<span></span><span></span><span></span>';
  b.appendChild(t); el.appendChild(av); el.appendChild(b); msgs.appendChild(el); msgs.scrollTop = msgs.scrollHeight;
}
function asRemoveTyping() { var el=document.getElementById('as-typing'); if(el) el.remove(); }

function asSend() {
  var inp = document.getElementById('as-input'); var text = inp.value.trim();
  if (!text || asLoading) return; inp.value = ''; inp.style.height = ''; asSubmit(text);
}

async function asSubmit(text) {
  if (!text || asLoading) return;
  document.getElementById('as-suggestions').innerHTML = '';
  asAppendMsg('user', text);
  asMsgCount++;
  asLoading = true;
  document.getElementById('as-send-btn').disabled = true;
  asShowTyping();
  setTimeout(function() {
    asRemoveTyping();
    asAppendMsg('bot', "Désolée, je suis encore en cours de configuration 🛠️ Je serai bientôt disponible pour répondre à toutes tes questions sur les offres, le fonctionnement de l'agence, ou ton projet. En attendant, jette un œil à nos offres en bas à droite — ou demande directement une démo gratuite !", true, false, false);
    asLoading = false; document.getElementById('as-send-btn').disabled = false;
  }, 1200);
}

function asSendData(trigger) {
  if (!AS_WEBHOOK || asHistory.length === 0) return;
  var payload = { session: asSessionId, trigger: trigger, timestamp: new Date().toISOString(), totalMessages: asMsgCount, hotness: asHotness, promoShown: asPromoShown, allMessages: asHistory.map(function(m){ return m.role+': '+m.content; }).join(' || ') };
  fetch(AS_WEBHOOK, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(function(){});
}

window.addEventListener('beforeunload', function() { if (asMsgCount > 0) asSendData('exit'); });

(function init() {
  asInjectAvatars();
  setTimeout(function() { if (!asOpen) document.getElementById('as-notif-badge').style.display = 'flex'; }, 4000);
  setTimeout(function() { if (!asOpen) { var qb = document.getElementById('as-question-bubble'); qb.style.display = 'block'; setTimeout(function() { qb.style.display = 'none'; }, 30000); } }, 30000);
  var inp = document.getElementById('as-input');
  if (inp) { inp.addEventListener('input', function() { this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 80) + 'px'; }); }
})();
</script></div>

</body>
